[mcp_servers.numista_review_browser]
command = "node"
args = [
    ".playwright-mcp/node_modules/@playwright/mcp/cli.js",
    "--browser",
    "chrome",
    "--user-data-dir",
    ".playwright-mcp/numista-review-profile",
    "--allowed-origins",
    "https://numista.com;https://*.numista.com",
    "--viewport-size",
    "1440x1000",
]
startup_timeout_sec = 120.0
enabled_tools = [
    "browser_click",
    "browser_fill_form",
    "browser_find",
    "browser_hover",
    "browser_navigate",
    "browser_navigate_back",
    "browser_press_key",
    "browser_select_option",
    "browser_snapshot",
    "browser_tabs",
    "browser_take_screenshot",
    "browser_type",
    "browser_wait_for",
]
