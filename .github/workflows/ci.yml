name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # El dominio es Kotlin puro: sus tablas doradas no necesitan el SDK de Android.
      - name: Tests del dominio
        run: ./gradlew :domain:test

      # Cliente de Numista, sync, presupuesto y catálogos curados reales. Ninguno toca la red:
      # todo sale de fixtures/numista y de data/.
      - name: Tests de la app
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar el APK de depuración
        run: ./gradlew :app:assembleDebug

      # Los informes de curación son Python y leen data/ igual que el dominio: sin esto,
      # sus tests viven sin correr y el informe se rompe en silencio hasta la próxima pasada.
      - name: Tests de los informes de curación
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      # Informativo, nunca bloqueante: no todo commit publica una versión. El que se niega a
      # publicar una versión que los móviles no verían es scripts/release.sh.
      - name: Comparar la versión del repo con la publicada
        if: always()
        run: |
          code=$(sed -n 's/^ *versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          published=$(curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/update.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' 2>/dev/null || echo 0)
          {
            echo "### Versión"
            echo ""
            echo "| | versionCode | versionName |"
            echo "|---|---|---|"
            echo "| repositorio | $code | $name |"
            echo "| publicado | $published | |"
            echo ""
            if [ "$code" -gt "$published" ]; then
              echo "Publicable con \`scripts/release.sh\`."
            else
              echo "Sube \`versionCode\` antes de publicar: los móviles no verían esta versión."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar los informes de test si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/

  # Informativo, nunca bloqueante (#94 / #132): dice en voz alta qué catálogos abiertos
  # se han quedado atrás. No corre en PR — un fork no tiene permiso de escritura de issues.
  stale-catalogs:
    # Sólo main: un workflow_dispatch desde otra rama reescribiría el issue con data/ incompleta.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Informe de catálogos abiertos por detrás
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          report=$(python3 scripts/stale-catalogs.py --sync)
          status=$?
          set -e
          {
            echo "### Catálogos abiertos por detrás"
            echo ""
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "El informe falló (exit $status); el job de tests no se toca." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  # Informativo, nunca bloqueante (#158): la auditoría del emparejamiento es del curador y
  # vive fuera de la app (#20). Mismo guardarraíl que el informe de arriba, y job aparte para
  # que un fallo de uno no esconda el otro.
  weight-deviations:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Informe de desviaciones de peso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          report=$(python3 scripts/weight-deviations.py --sync)
          status=$?
          set -e
          {
            echo "### Desviaciones de peso"
            echo ""
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "El informe falló (exit $status); el job de tests no se toca." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
