name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # El dominio es Kotlin puro: sus tablas doradas no necesitan el SDK de Android.
      - name: Tests del dominio
        run: ./gradlew :domain:test

      # Cliente de Numista, sync, presupuesto y catálogos curados reales. Ninguno toca la red:
      # todo sale de fixtures/numista y de data/.
      - name: Tests de la app
        run: ./gradlew :app:testDebugUnitTest

      - name: Compilar el APK de depuración
        run: ./gradlew :app:assembleDebug

      # Informativo, nunca bloqueante: no todo commit publica una versión. El que se niega a
      # publicar una versión que los móviles no verían es scripts/release.sh.
      - name: Comparar la versión del repo con la publicada
        if: always()
        run: |
          code=$(sed -n 's/^ *versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          name=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          published=$(curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/update.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])' 2>/dev/null || echo 0)
          {
            echo "### Versión"
            echo ""
            echo "| | versionCode | versionName |"
            echo "|---|---|---|"
            echo "| repositorio | $code | $name |"
            echo "| publicado | $published | |"
            echo ""
            if [ "$code" -gt "$published" ]; then
              echo "Publicable con \`scripts/release.sh\`."
            else
              echo "Sube \`versionCode\` antes de publicar: los móviles no verían esta versión."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar los informes de test si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
