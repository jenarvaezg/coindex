[workspace]
members = ["backend", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "crates/domain" }
http-body-util = "0.1"
maud = { version = "0.27", features = ["axum"] }
numista = { path = "crates/numista" }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuttle-axum = "0.57"
shuttle-runtime = "0.57"
shuttle-shared-db = { version = "0.57", features = ["postgres", "sqlx"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = "0.5"
tracing = "0.1"
