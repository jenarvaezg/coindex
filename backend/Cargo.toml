[package]
name = "coindex-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "coindex_backend"
path = "src/lib.rs"

[[bin]]
name = "coindex-backend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "../crates/domain" }
maud = "0.27"
numista = { path = "../crates/numista" }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
serde.workspace = true
serde_json.workspace = true
shuttle-axum = "0.57"
shuttle-runtime = "0.57"
shuttle-shared-db = { version = "0.57", features = ["postgres", "sqlx"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
